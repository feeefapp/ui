name: feeef_ui
description: "Feeef UI kit for Flutter: the Dart twin of @feeef.dev/ui."
version: 0.16.3
publish_to: none
homepage:

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Glass refraction on Impeller (glass/refraction_filter.dart) and the ambient pixel field
  # (brand/pixel_shader.dart).
  shaders:
    - shaders/glass_refraction.frag
    - shaders/pixel_field.frag
  # The kit's fonts: IBM Plex Sans Arabic (Arabic and Latin) and Outfit (brand), both SIL OFL 1.1.
  # Stored without hinting or glyph names (every glyph and layout feature kept): Flutter turns
  # hinting off for all text, and Flutter web downloads these before its first frame (-35% gzip,
  # renders pixel-identical). Redo after replacing a font:
  #   pyftsubset F.ttf --unicodes='*' --glyphs='*' --layout-features='*' --name-IDs='*'
  #     --name-languages='*' --notdef-outline --no-hinting --desubroutinize --output-file=F.ttf
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Variable.ttf
